<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>SmartGlass AI v0.4</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#111827}
    header{background:#111827;color:#fff;padding:18px;text-align:center} header h1{margin:0 0 6px;font-size:24px}
    .wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0000000d}
    button{border:0;border-radius:12px;padding:12px 16px;background:#111827;color:#fff;font-size:15px;cursor:pointer}
    button.secondary{background:#e5e7eb;color:#111827} button.danger{background:#b91c1c}
    input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:6px 0 12px;font-size:15px}
    label{display:block;font-weight:bold;margin-top:8px}.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap}
    .glass{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin:10px 0;background:#fafafa}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.thumb{width:100%;height:130px;object-fit:cover;border-radius:10px;background:#eee}
    .msg{padding:10px;border-radius:10px;margin:10px 0;background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}
    .camera{width:100%;max-height:360px;background:#000;border-radius:14px;object-fit:cover}
    .suggestions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.suggestions .glass{margin:0}
    @media(max-width:650px){.suggestions{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<header><h1>SmartGlass AI</h1><div>نسخه ۰.۴ — سیستم ضدکش و مدیریت پایدار</div></header>
<div class="wrap">
  <div id="home" class="card">
    <h2>انتخاب بخش</h2>
    <div class="tabs">
      <button id="customerBtn">نسخه مشتری</button>
      <button id="adminBtn" class="secondary">نسخه مدیریت</button>
    </div>
  </div>

  <section id="customer" class="hidden">
    <div class="card">
      <h2>مشاور هوشمند عینک</h2>
      <p>ابتدا عکس چهره را بگیرید. سیستم از موجودی ثبت‌شده فروشگاه برای پیشنهاد مدل استفاده می‌کند.</p>
      <video id="camera" class="camera" autoplay playsinline></video>
      <canvas id="canvas" class="hidden"></canvas>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button id="startCamera">فعال‌کردن دوربین</button>
        <button id="takePhoto">گرفتن عکس</button>
        <button id="backHome" class="secondary">بازگشت</button>
      </div>
      <img id="facePreview" class="camera hidden" alt="عکس مشتری">
    </div>
    <div class="card">
      <h3>۵ مدل پیشنهادی</h3>
      <div id="suggestions" class="suggestions"></div>
      <label>اگر مدل خاصی مدنظر دارید، شماره مدل را وارد کنید</label>
      <input id="requestedModel" placeholder="مثلاً SG-102">
      <button id="tryRequested">آماده‌سازی پرو مجازی</button>
      <div id="tryMsg"></div>
    </div>
  </section>

  <section id="admin" class="hidden">
    <div class="card">
      <h2>ورود مدیریت</h2>
      <input id="adminPass" type="password" placeholder="رمز مدیریت">
      <button id="loginAdmin">ورود</button>
      <div id="loginMsg"></div>
    </div>
    <div id="adminPanel" class="hidden">
      <div class="card">
        <h2>ثبت عینک</h2>
        <input id="gModel" placeholder="شماره/مدل (مثلاً SG-101)">
        <input id="gBrand" placeholder="برند">
        <input id="gColor" placeholder="رنگ">
        <input id="gPrice" type="number" placeholder="قیمت">
        <input id="gStock" type="number" min="0" placeholder="موجودی">
        <label>عرض کلی فریم (mm)</label><input id="gWidth" type="number">
        <label>عرض عدسی (mm)</label><input id="gLens" type="number">
        <label>عرض پل (mm)</label><input id="gBridge" type="number">
        <label>طول دسته (mm)</label><input id="gTemple" type="number">
        <label>عکس روبه‌رو</label><input id="gFront" type="file" accept="image/*">
        <label>عکس ۴۵ درجه</label><input id="g45" type="file" accept="image/*">
        <label>عکس جانبی</label><input id="gSide" type="file" accept="image/*">
        <button id="saveGlass">ثبت عینک</button>
        <div id="saveMsg"></div>
      </div>
      <div class="card">
        <h2>موجودی ثبت‌شده</h2>
        <input id="search" placeholder="جستجوی مدل یا برند">
        <div id="catalog"></div>
      </div>
      <button id="logoutAdmin" class="secondary">خروج از مدیریت</button>
    </div>
  </section>
</div>
<script src="./app.js?v=0.4.0"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js?v=0.4.0', {updateViaCache:'none'});
      await reg.update();
    } catch(e) { console.log('SW error', e); }
  });
}
</script>
</body>
</html>
